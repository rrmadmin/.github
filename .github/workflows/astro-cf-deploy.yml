name: Astro + CF Pages reusable deploy

# Reusable workflow consumed by every Astro site in the rrmadmin ecosystem
# (neofertility-ie, whittaker-ai, rrm-foundation-site, lunira, etc.).
#
# Replaces CF Pages' native git auto-deploy when the project has been
# converted to "Direct Upload" mode (a one-way conversion that happens
# whenever wrangler pages deploy is run, per CF docs / API error 8000069).
#
# Each consumer site has a ~15-line workflow at .github/workflows/deploy.yml
# that delegates to this one. See README at https://github.com/rrmadmin/.github
# for the canonical caller template + secret setup.
#
# Assumes the consumer Astro site uses our shared `site-ssot` build pipeline
# (rrmadmin/rrm-tools) + the canonical `ecosystem-identity` registry. Sites
# that don't use site-ssot need a different workflow.

on:
  workflow_call:
    inputs:
      project-name:
        description: "CF Pages project name (e.g., neofertility-ie)"
        required: true
        type: string
      cloudflare-account-id:
        description: "CF account ID that owns the Pages project"
        required: true
        type: string
      branch:
        description: "Branch to deploy under (production = main on most projects)"
        required: false
        type: string
        default: main
      build-staging-block:
        description: "ASTRO_STAGING_BLOCK env value passed to npm run build (1=staging robots/headers, 0=production)"
        required: false
        type: string
        default: "1"
      node-version:
        description: "Node version for the runner"
        required: false
        type: string
        default: "22"
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: "CF API token with Pages: Edit"
        required: true
      GH_TOOLS_PAT:
        description: "GitHub PAT with read access to rrmadmin/rrm-tools + rrmadmin/ecosystem-identity"
        required: true
      MCRN_PHIL_BOYLE:
        description: "Phil Boyle's MCRN. Public per imc.ie; held as a secret to honour the registry's pii_class:restricted convention without committing the literal."
        required: false
      MCRN_AGNES_TOTH:
        description: "Agnes Toth's MCRN. Public per imc.ie; held as a secret for the same reason."
        required: false

jobs:
  deploy:
    name: Build + deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Checkout rrm-tools
        uses: actions/checkout@v4
        with:
          repository: rrmadmin/rrm-tools
          token: ${{ secrets.GH_TOOLS_PAT }}
          path: _ecosystem/tools-src

      - name: Checkout ecosystem-identity registry
        uses: actions/checkout@v4
        with:
          repository: rrmadmin/ecosystem-identity
          token: ${{ secrets.GH_TOOLS_PAT }}
          path: _ecosystem/identity-src

      - name: Stage ecosystem layout (mirror local ~/iCode/...)
        run: |
          set -euo pipefail
          # site-ssot's lib/paths.mjs hardcodes:
          #   ECOSYSTEM_IDENTITY_DIR = resolve(homedir(), 'iCode/config/ecosystem-identity')
          # ssot-prebuild.mjs hardcodes:
          #   TOOL_ROOT = resolve(PROJECT_ROOT, '../../tools/site-ssot')
          # Mirror both layouts symbolically.
          # 1. Tools at ../../tools relative to project (matches local ~/iCode/tools)
          ln -snf "$GITHUB_WORKSPACE/_ecosystem/tools-src" "$GITHUB_WORKSPACE/../../tools"
          # 2. Tools also at $HOME/iCode/tools (some scripts reference ~/iCode/tools/... directly,
          #    e.g. package.json postbuild "standards": "node ~/iCode/tools/standards-gate/run.mjs")
          mkdir -p "$HOME/iCode"
          ln -snf "$GITHUB_WORKSPACE/_ecosystem/tools-src" "$HOME/iCode/tools"
          # 3. Registry at $HOME/iCode/config/ecosystem-identity (Node's homedir() based path)
          mkdir -p "$HOME/iCode/config"
          ln -snf "$GITHUB_WORKSPACE/_ecosystem/identity-src" "$HOME/iCode/config/ecosystem-identity"
          # Verify each path
          ls "$GITHUB_WORKSPACE/../../tools/site-ssot/bin/" >/dev/null
          ls "$HOME/iCode/tools/standards-gate/" >/dev/null
          ls "$HOME/iCode/config/ecosystem-identity/" >/dev/null
          echo "OK: ecosystem layout staged (../../tools + ~/iCode/tools + ~/iCode/config/ecosystem-identity)"

      # site-ssot's op-inject.mjs spawns the 1Password CLI to resolve any
      # _value_source: "op://..." entries in the registry. CI runners don't
      # have op + the 1P service-account token (and uploading the master
      # token would massively expand its blast radius). Instead, accept
      # narrow per-identifier secrets at the caller and substitute them
      # into the registry files in-place before site-ssot runs.
      #
      # Currently 2 identifiers use _value_source:
      #   - people[phil-boyle].MCRN  → MCRN_PHIL_BOYLE secret
      #   - people[agnes-toth].MCRN  → MCRN_AGNES_TOTH secret
      #
      # Add new pairs here as they appear in the registry. If the secret
      # is unset, the entry is left as-is and the build will fail with the
      # original op-spawn error — that's intentional, surfaces the gap.
      - name: Resolve op-sourced identifiers via narrow secrets
        env:
          REG_DIR: ${{ github.workspace }}/_ecosystem/identity-src
          MCRN_PHIL_BOYLE: ${{ secrets.MCRN_PHIL_BOYLE }}
          MCRN_AGNES_TOTH: ${{ secrets.MCRN_AGNES_TOTH }}
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const path = require('path');
            const file = path.join(process.env.REG_DIR, 'people.json');
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const map = {
              'op://Automation/Identifiers-PhilBoyle/MCRN': process.env.MCRN_PHIL_BOYLE,
              'op://Automation/Identifiers-AgnesToth/MCRN': process.env.MCRN_AGNES_TOTH,
            };
            let resolved = 0, skipped = 0;
            for (const person of (data.people || [])) {
              for (const ident of (person.identifiers || [])) {
                if (typeof ident._value_source !== 'string') continue;
                const v = map[ident._value_source];
                if (v && v.length > 0) {
                  ident.value = v;
                  delete ident._value_source;
                  resolved++;
                } else {
                  skipped++;
                  console.error('UNRESOLVED:', ident._value_source);
                }
              }
            }
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
            console.log('resolved=' + resolved + ' skipped=' + skipped);
            if (skipped > 0) process.exit(1);
          "

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies (caller)
        run: npm ci

      - name: Install dependencies (site-ssot)
        working-directory: _ecosystem/tools-src/site-ssot
        run: npm ci || npm install

      - name: Install dependencies (standards-gate)
        working-directory: _ecosystem/tools-src/standards-gate
        run: npm ci || npm install

      - name: Build
        env:
          ASTRO_STAGING_BLOCK: ${{ inputs.build-staging-block }}
          SITE_SSOT_ENABLED: "1"
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ inputs.cloudflare-account-id }}
          command: pages deploy dist/ --project-name=${{ inputs.project-name }} --branch=${{ inputs.branch }} --commit-dirty=true --commit-hash=${{ github.sha }}
