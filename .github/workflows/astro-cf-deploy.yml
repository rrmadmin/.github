name: Astro + CF Pages reusable deploy

# Reusable workflow consumed by every Astro site in the rrmadmin ecosystem
# (neofertility-ie, whittaker-ai, rrm-foundation-site, lunira, etc.).
#
# Replaces CF Pages' native git auto-deploy when the project has been
# converted to "Direct Upload" mode (a one-way conversion that happens
# whenever wrangler pages deploy is run, per CF docs / API error 8000069).
#
# Each consumer site has a 10-line workflow at .github/workflows/deploy.yml:
#
#   on:
#     push: { branches: [main] }
#     workflow_dispatch:
#   jobs:
#     deploy:
#       uses: rrmadmin/.github/workflows/astro-cf-deploy.yml@main
#       with:
#         project-name: my-project-name
#       secrets: inherit
#
# Org-level secrets required (set once at rrmadmin GitHub org, inherited by all consumers):
#   - CLOUDFLARE_API_TOKEN  — CF API token with Pages: Edit
#   - GH_TOOLS_PAT          — PAT with read access to rrmadmin/rrm-tools + rrmadmin/ecosystem-identity
#
# Org-level vars required:
#   - CLOUDFLARE_ACCOUNT_ID — the CF account that owns the Pages project
#
# (Vars + secrets at the rrmadmin org level → all member repos inherit; no per-site setup.)

on:
  workflow_call:
    inputs:
      project-name:
        description: "CF Pages project name (e.g., neofertility-ie)"
        required: true
        type: string
      branch:
        description: "Branch to deploy under (production = main on most projects)"
        required: false
        type: string
        default: main
      ssot-enabled:
        description: "Whether to run the site-ssot prebuild (default true; sites without site-ssot integration set false)"
        required: false
        type: boolean
        default: true
      build-staging-block:
        description: "ASTRO_STAGING_BLOCK env value passed to npm run build (1=staging robots/headers, 0=production)"
        required: false
        type: string
        default: "1"
      node-version:
        description: "Node version for the runner"
        required: false
        type: string
        default: "22"

jobs:
  deploy:
    name: Build + deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: astro-cf-deploy-${{ inputs.project-name }}-${{ inputs.branch }}
      cancel-in-progress: false

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      # rrm-tools holds site-ssot, standards-gate, and other shared build tools.
      # Mirror the local layout (~/iCode/tools/...) so scripts that resolve paths
      # via `resolve(projectRoot, '../../tools/...')` Just Work in CI.
      - name: Checkout rrm-tools
        if: ${{ inputs.ssot-enabled }}
        uses: actions/checkout@v4
        with:
          repository: rrmadmin/rrm-tools
          token: ${{ secrets.GH_TOOLS_PAT }}
          path: _ecosystem/tools-src

      - name: Checkout ecosystem-identity registry
        if: ${{ inputs.ssot-enabled }}
        uses: actions/checkout@v4
        with:
          repository: rrmadmin/ecosystem-identity
          token: ${{ secrets.GH_TOOLS_PAT }}
          path: _ecosystem/identity-src

      - name: Stage ecosystem layout (mirror local ~/iCode/...)
        if: ${{ inputs.ssot-enabled }}
        run: |
          set -euo pipefail
          # site-ssot's lib/paths.mjs hardcodes:
          #   ECOSYSTEM_IDENTITY_DIR = resolve(homedir(), 'iCode/config/ecosystem-identity')
          # ssot-prebuild.mjs hardcodes:
          #   TOOL_ROOT = resolve(PROJECT_ROOT, '../../tools/site-ssot')
          # Mirror both layouts symbolically.

          # 1. Tools at ../../tools (one level above $GITHUB_WORKSPACE's parent)
          ln -snf "$GITHUB_WORKSPACE/_ecosystem/tools-src" "$GITHUB_WORKSPACE/../../tools"

          # 2. Registry under $HOME (Node's homedir())
          mkdir -p "$HOME/iCode/config"
          ln -snf "$GITHUB_WORKSPACE/_ecosystem/identity-src" "$HOME/iCode/config/ecosystem-identity"

          # Verify resolution
          node -e "
            const path = require('path');
            const os = require('os');
            console.log('TOOL_ROOT  =', path.resolve(process.cwd(), '../../tools/site-ssot'));
            console.log('REGISTRY   =', path.resolve(os.homedir(), 'iCode/config/ecosystem-identity'));
          "
          ls "$GITHUB_WORKSPACE/../../tools/site-ssot/bin/" >/dev/null
          ls "$HOME/iCode/config/ecosystem-identity/" >/dev/null
          echo "OK: ecosystem layout staged"

      - name: Setup Node ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies (caller)
        run: npm ci

      - name: Install dependencies (site-ssot)
        if: ${{ inputs.ssot-enabled }}
        working-directory: _ecosystem/tools-src/site-ssot
        run: npm ci || npm install

      - name: Build
        env:
          ASTRO_STAGING_BLOCK: ${{ inputs.build-staging-block }}
          SITE_SSOT_ENABLED: ${{ inputs.ssot-enabled && '1' || '0' }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=${{ inputs.project-name }} --branch=${{ inputs.branch }} --commit-dirty=true --commit-hash=${{ github.sha }}
