name: Astro + CF Pages reusable deploy

# Reusable workflow consumed by every Astro site in the rrmadmin ecosystem
# (neofertility-ie, whittaker-ai, rrm-foundation-site, lunira, etc.).
#
# Replaces CF Pages' native git auto-deploy when the project has been
# converted to "Direct Upload" mode (a one-way conversion that happens
# whenever wrangler pages deploy is run, per CF docs / API error 8000069).
#
# Each consumer site has a ~15-line workflow at .github/workflows/deploy.yml
# that delegates to this one. See README at https://github.com/rrmadmin/.github
# for the canonical caller template + secret setup.
#
# Assumes the consumer Astro site uses our shared `site-ssot` build pipeline
# (rrmadmin/rrm-tools) + the canonical `ecosystem-identity` registry. Sites
# that don't use site-ssot need a different workflow.

on:
  workflow_call:
    inputs:
      project-name:
        description: "CF Pages project name (e.g., neofertility-ie)"
        required: true
        type: string
      cloudflare-account-id:
        description: "CF account ID that owns the Pages project"
        required: true
        type: string
      branch:
        description: "Branch to deploy under (production = main on most projects)"
        required: false
        type: string
        default: main
      build-staging-block:
        description: "ASTRO_STAGING_BLOCK env value passed to npm run build (1=staging robots/headers, 0=production)"
        required: false
        type: string
        default: "1"
      node-version:
        description: "Node version for the runner"
        required: false
        type: string
        default: "22"
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: "CF API token with Pages: Edit"
        required: true
      GH_TOOLS_PAT:
        description: "GitHub PAT with read access to rrmadmin/rrm-tools + rrmadmin/ecosystem-identity"
        required: true

jobs:
  deploy:
    name: Build + deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Checkout rrm-tools
        uses: actions/checkout@v4
        with:
          repository: rrmadmin/rrm-tools
          token: ${{ secrets.GH_TOOLS_PAT }}
          path: _ecosystem/tools-src

      - name: Checkout ecosystem-identity registry
        uses: actions/checkout@v4
        with:
          repository: rrmadmin/ecosystem-identity
          token: ${{ secrets.GH_TOOLS_PAT }}
          path: _ecosystem/identity-src

      - name: Stage ecosystem layout (mirror local ~/iCode/...)
        run: |
          set -euo pipefail
          # site-ssot's lib/paths.mjs hardcodes:
          #   ECOSYSTEM_IDENTITY_DIR = resolve(homedir(), 'iCode/config/ecosystem-identity')
          # ssot-prebuild.mjs hardcodes:
          #   TOOL_ROOT = resolve(PROJECT_ROOT, '../../tools/site-ssot')
          # Mirror both layouts symbolically.
          ln -snf "$GITHUB_WORKSPACE/_ecosystem/tools-src" "$GITHUB_WORKSPACE/../../tools"
          mkdir -p "$HOME/iCode/config"
          ln -snf "$GITHUB_WORKSPACE/_ecosystem/identity-src" "$HOME/iCode/config/ecosystem-identity"
          ls "$GITHUB_WORKSPACE/../../tools/site-ssot/bin/" >/dev/null
          ls "$HOME/iCode/config/ecosystem-identity/" >/dev/null
          echo "OK: ecosystem layout staged"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies (caller)
        run: npm ci

      - name: Install dependencies (site-ssot)
        working-directory: _ecosystem/tools-src/site-ssot
        run: npm ci || npm install

      - name: Build
        env:
          ASTRO_STAGING_BLOCK: ${{ inputs.build-staging-block }}
          SITE_SSOT_ENABLED: "1"
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ inputs.cloudflare-account-id }}
          command: pages deploy dist/ --project-name=${{ inputs.project-name }} --branch=${{ inputs.branch }} --commit-dirty=true --commit-hash=${{ github.sha }}
